name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "obsidian-vault-search-release"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "backend") | Out-Null
          Copy-Item -Recurse -Force backend/vault_search (Join-Path $stage "backend")
          Copy-Item -Force backend/requirements.txt,backend/requirements-runtime.txt,backend/requirements-optional-tensorrt.txt,backend/setup-runtime.ps1,backend/pyproject.toml (Join-Path $stage "backend")
          Get-ChildItem -Path (Join-Path $stage "backend") -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Compress-Archive -Path main.js,manifest.json,versions.json,styles.css,(Join-Path $stage "backend") -DestinationPath obsidian-vault-search-${{ github.ref_name }}.zip
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME main.js manifest.json styles.css versions.json "obsidian-vault-search-$env:GITHUB_REF_NAME.zip" --verify-tag --title $env:GITHUB_REF_NAME --generate-notes

name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - shell: pwsh
        run: Compress-Archive -Path main.js,manifest.json,versions.json,styles.css,backend/vault_search,backend/requirements.txt,backend/pyproject.toml -DestinationPath obsidian-vault-search-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: obsidian-vault-search-${{ github.ref_name }}.zip

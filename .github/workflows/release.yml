name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - shell: pwsh
        run: Compress-Archive -Path main.js,manifest.json,versions.json,styles.css,backend/vault_search,backend/requirements.txt,backend/pyproject.toml -DestinationPath obsidian-vault-search-${{ github.ref_name }}.zip
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "obsidian-vault-search-$env:GITHUB_REF_NAME.zip" --verify-tag --title $env:GITHUB_REF_NAME --generate-notes

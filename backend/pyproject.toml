[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-vault-search-backend"
version = "0.1.67"
description = "Local hybrid search backend daemon for obsidian-vault-search"
requires-python = ">=3.10"
dependencies = [
  "kiwipiepy==0.23.1",
  "numpy==2.4.4",
  "sentence-transformers==5.4.1",
  "tokenizers==0.22.2",
  "transformers==5.6.2",
  "torch==2.11.0",
  "usearch==2.25.1",
  "PyYAML==6.0.3",
  "tqdm>=4.65.0,<5",
  "onnxruntime==1.25.1",
  "onnx==1.20.0",
  "mcp==1.28.1"
]

[project.scripts]
vault-search = "vault_search.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vault_search*"]

# Pin the lint rule set so `python -m ruff check .` is deterministic across
# ruff versions (0.16+ enables far more rules by default than this codebase
# targets; the project contract is pyflakes + pycodestyle errors only).
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
